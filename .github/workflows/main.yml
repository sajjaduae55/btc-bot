import ccxt

print("Bot Started...")

try:
    # Public connection - No keys needed for price
    exchange = ccxt.binance({
        'enableRateLimit': True
    })
    
    # Get BTC Price - This will work
    ticker = exchange.fetch_ticker('BTC/USDT')
    price = ticker['last']
    print(f"BTC Price is: {price}")

    # Simple Strategy Example
    if price < 110000:
        print("Signal: BUY - Price is Low")
    else:
        print("Signal: WAIT - Price is High")

    print("Bot is LIVE - Price check OK!")

except Exception as e:
    print(f"Error: {e}")

print("Bot Finished - OK")
